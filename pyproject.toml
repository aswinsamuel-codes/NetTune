[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nettune"
description = "Local network diagnosis and optimization dashboard for Windows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.scripts]
nettune = "nettune.__main__:main"

[tool.setuptools]
packages = ["nettune", "nettune.fixes"]

[tool.setuptools.package-data]
nettune = ["web/*"]

[tool.setuptools.dynamic]
version = { attr = "nettune.__version__" }
